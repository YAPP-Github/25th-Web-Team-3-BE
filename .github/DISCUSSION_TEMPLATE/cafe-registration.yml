title: "카페 등록"
labels: ["cafe-registration"]
body:
 - type: input
   id: cafe_name
   attributes:
     label: 카페명
     description: 카페의 정식 상호명을 입력해주세요
   validations:
     required: true
 - type: textarea
   id: reason
   attributes:
     label: 선정 이유
     description: 이 카페를 선정한 이유를 설명해주세요
   validations:
     required: true
 - type: input
   id: address
   attributes:
     label: 도로명 주소
     description: 정확한 도로명 주소를 입력해주세요
     placeholder: "서울특별시 강남구 테헤란로 123"
   validations:
     required: true
 - type: input
   id: map_url
   attributes:
     label: 지도 URL
     description: 네이버 지도 URL을 입력해주세요
   validations:
     required: true
 - type: input
   id: tags
   attributes:
     label: 태그 
     description: 태그를 쉼표(,)로 구분하여 입력해주세요
     placeholder: "로스터리, 베이커리, 테라스, 주차가능"
   validations:
     required: true
 - type: input
   id: region
   attributes:
     label: 필터상 지역
     description: 지역을 입력해주세요
     placeholder: "성수/서울숲"
   validations:
     required: true
 - type: input
   id: station
   attributes:
     label: 역 정보
     description: 가장 가까운 역과 출구 번호를 입력해주세요
     placeholder: "강남역"
   validations:
     required: true
 - type: textarea
   id: main_image
   attributes:
     label: 메인 이미지
     description: 이미지를 여기에 드래그앤드롭 해주세요
   validations:
     required: true
 - type: markdown
   attributes:
     value: "## 대표 원두"
 - type: input
   id: bean_name
   attributes:
     label: 원두명
     description: 대표 원두의 이름을 입력해주세요
   validations:
     required: true
 - type: textarea
   id: flavors
   attributes:
     label: 향미
     description: |
       향미를 입력해주세요.
       형식: 번호|세부향미
       예시: 1|블루베리
       
       참고
       1: Fruity (#DB1C24)
       2: Floral (#DB0D69)
       3: Sweet (#E45833)
       4: Nutty (#A97B64)
       5: Spices (#AE203E)
       6: Roasted (#C94930)
       7: Green (#177A30)
       8: Sour (#ECB50F)
       9: Other (#0AA4B6)
     value: |
       1|블루베리
       3|카라멜
       4|아몬드
     placeholder: |
       1|블루베리
       3|초콜릿
       4|헤이즐넛
       5|시나몬
       6|로스티드
   validations:
     required: true
     pattern: '^[1-9]\|.+(\n[1-9]\|.+)*$'
 - type: input
   id: blend_type
   attributes:
     label: 싱글/블렌드 여부
     description: 싱글 블렌드 여부를 작성해주세요
     placeholder: "싱글, 블렌드"
   validations:
     required: true
 - type: input
   id: origins
   attributes:
     label: 산지
     description: 원두 산지를 쉼표(,)로 구분하여 입력해주세요
     placeholder: "에티오피아, 과테말라"
   validations:
     required: true
 - type: input
   id: roasting
   attributes:
     label: 로스팅
     description: 로스팅 정도를 입력해주세요
   validations:
     required: true
 - type: textarea
   id: bean_details
   attributes:
     label: 원두 상세정보
     description: 원두에 대한 추가 정보를 입력해주세요
   validations:
     required: false
 - type: markdown
   attributes:
     value: |
       ## 대표 메뉴
       ⚠️ 아래 양식에 맞춰서 메뉴를 입력해주세요.
       메뉴와 메뉴 사이는 반드시 구분선(---)으로 구분해주세요.
 - type: textarea
   id: menus
   attributes:
     label: 메뉴 목록
     value: |
       이름: 
       가격: 
       이미지: 
       상세정보:
       ---
       이름: 
       가격: 
       이미지: 
       상세정보:
     description: |
       ✔️ 입력 방법
       1. 이름: [메뉴 이름]
       2. 가격: [숫자만 입력, 상시 변경은 -1]
       3. 이미지: [이미지 URL]
       4. 메뉴 추가시 위 형식을 복사하여 사용 (---로 구분)
   validations:
     required: true
     pattern: "^(이름: .+\\n가격: (-1|[0-9]+)\\n이미지: https?:\\/\\/.+\\n---\\n)*이름: .+\\n가격: (-1|[0-9]+)\\n이미지: https?:\\/\\/.+$"
